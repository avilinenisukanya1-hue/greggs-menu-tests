name: Greggs menu tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this pattern (e.g. @smoke)'
        required: false
  schedule:
    # Daily at 06:17 UTC – the menu is content-managed and changes without code deploys.
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: menu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Type-check
        run: npm run typecheck

      - name: Run Playwright suite
        run: npx playwright test ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}
        env:
          CI: 'true'

      - name: Summarise results
        if: always()
        run: node scripts/summarise-results.mjs

      - name: Upload HTML report & raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            reports/html
            reports/junit.xml
            reports/results.json
            reports/SUMMARY.md
          retention-days: 30

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ github.run_number }}
          path: reports/artifacts
          retention-days: 14

      - name: Prepare Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/html

  publish-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Needs Settings → Pages → Source: "GitHub Actions". Non-blocking if not enabled.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
