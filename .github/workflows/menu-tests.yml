name: Greggs menu tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this pattern (e.g. @smoke)'
        required: false
  schedule:
    # Daily at 06:17 UTC - the menu is content-managed and changes without code deploys.
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: menu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Type-check
        run: npm run typecheck

      - name: Run Playwright suite
        # Pass the dispatch input through env, never interpolate it into the script (shell injection).
        run: npx playwright test ${GREP:+--grep "$GREP"}
        env:
          CI: 'true'
          GREP: ${{ github.event.inputs.grep }}

      - name: Summarise results
        if: ${{ !cancelled() }}
        run: node scripts/summarise-results.mjs

      # Separate run so perf timings aren't skewed by the functional suite's traffic.
      # Report-only in CI: hosted runners are 2-vCPU machines in the US, so CPU-bound
      # metrics (TBT) and UK-hosted latency miss the budgets set for a local machine.
      # Results are still recorded in the summary and the published report.
      - name: Run performance checks
        if: ${{ !cancelled() && !github.event.inputs.grep }}
        continue-on-error: true
        run: npm run test:perf
        env:
          CI: 'true'

      - name: Summarise performance results
        if: ${{ !cancelled() && hashFiles('reports/perf/results.json') != '' }}
        run: npm run summary:perf

      - name: Upload HTML report & raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            reports/html
            reports/junit.xml
            reports/results.json
            reports/SUMMARY.md
            reports/perf/html
            reports/perf/results.json
            reports/perf/SUMMARY.md
          retention-days: 30

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ github.run_number }}
          path: |
            reports/artifacts
            reports/perf/artifacts
          retention-days: 14

      - name: Add performance report to the published site
        if: ${{ !cancelled() && hashFiles('reports/perf/html/index.html') != '' }}
        run: cp -r reports/perf/html reports/html/perf

      - name: Prepare Pages artifact
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('reports/html/index.html') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/html

  publish-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Needs Settings > Pages > Source: "GitHub Actions". Non-blocking if not enabled.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
